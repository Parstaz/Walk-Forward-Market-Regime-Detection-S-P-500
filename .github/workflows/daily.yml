name: Daily update

on:
  schedule:
    # 22:30 UTC on weekdays = 17:30 New York in winter, 18:30 in summer (after the close).
    # Exchange holidays exit cleanly with no new trading day and no commit.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Never let two updates overlap; a queued run waits for the running one.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # Exits 1 on any failed fetch or check, which fails the job (and emails
      # the repo owner) before the commit step; the data files are untouched.
      - name: Update data
        run: python scripts/daily_update.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data models)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          as_of=$(python -c "import json; print(json.load(open('data/metadata.json'))['data_as_of'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data models
          git commit -m "data: update through ${as_of}"
          git push
